# ── Input ────────────────────────────────────────────────────────────────────
input {
    kb_layout = us
    numlock_by_default = true
    repeat_delay = 250
    repeat_rate = 35

    follow_mouse = $lm_follow_mouse   # Lumen Settings → Windows
    off_window_axis_events = 2

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        clickfinger_behavior = true
        scroll_factor = 0.7
    }
}

# Touchpad gestures
#   3 fingers, any direction  move the window under the fingers
#   3 fingers, pinch          toggle fullscreen
#   4 fingers, left / right   previous / next workspace (follows your fingers)
#   4 fingers, up             open the overview
#   4 fingers, down           close it
# (Hot corners — pointer into top-left / top-right — live in the shell.)
gesture = 3, swipe, move
gesture = 3, pinch, fullscreen
gesture = 4, horizontal, workspace
gesture = 4, up, dispatcher, global, lumen:overviewOpen
gesture = 4, down, dispatcher, global, lumen:overviewClose

gestures {
    workspace_swipe_distance = 700
    workspace_swipe_cancel_ratio = 0.2
    workspace_swipe_min_speed_to_force = 5
    workspace_swipe_direction_lock = true
    workspace_swipe_create_new = true
}

binds {
    scroll_event_delay = 0
    hide_special_on_workspace_change = true
    workspace_back_and_forth = false
}
