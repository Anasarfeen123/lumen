# ── Lock screen (minimal, Phase 2) ───────────────────────────────────────────
# Time, date, one input field. Battery and media arrive with the Phase 10
# polish. Colours/fonts are the shared tokens.
source = ~/.config/lumen/generated/hypr/vars.conf

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = lm_standard, 0.2, 0, 0, 1
    animation = fadeIn, 1, 2.2, lm_standard
    animation = fadeOut, 1, 1.5, lm_standard
    animation = inputFieldDots, 1, 1.2, lm_standard
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    vibrancy = 0.1
    color = $lm_bg
}

# Time — display style: 64 px, light weight
label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    font_family = $lm_font_ui Light
    font_size = 64
    color = $lm_text
    position = 0, 120
    halign = center
    valign = center
}

# Date — caption style
label {
    monitor =
    text = cmd[update:60000] date "+%A, %-d %B"
    font_family = $lm_font_ui
    font_size = 13
    color = $lm_text_secondary
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 44
    outline_thickness = 1
    rounding = -1
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    outer_color = $lm_border_strong
    inner_color = $lm_glass_panel
    font_color = $lm_text
    font_family = $lm_font_ui
    check_color = $lm_accent
    fail_color = $lm_error
    capslock_color = $lm_warning
    fade_on_empty = false
    placeholder_text = <span foreground="##$lm_hex_text_muted">Password</span>
    fail_text = <span foreground="##$lm_hex_error">$FAIL</span>
    position = 0, -40
    halign = center
    valign = center
}
