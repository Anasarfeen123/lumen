# ── Keybinds ─────────────────────────────────────────────────────────────────
# Mirrors illogical-impulse muscle memory where it makes sense.
# Shell binds (overview, sidebars, island…) are added as each phase lands and
# use `global, lumen:<action>` so Quickshell receives them directly.
#
# bind flags:  e = repeat while held   l = works on lock screen   r = on release

$mod = SUPER
$bin = ~/.config/lumen/bin
$scripts = ~/.config/lumen/scripts

$terminal    = kitty
$fileManager = $bin/lumen-launch dolphin nautilus "kitty -e yazi"
$browser     = $bin/lumen-launch brave-browser firefox chromium
$editor      = $bin/lumen-launch code codium zed kate
$taskManager = $bin/lumen-launch plasma-systemmonitor "kitty -e btop"

# ── Apps ─────────────────────────────────────────────────────────────────────
bind = $mod, Return, exec, $terminal
bind = $mod, T, exec, $terminal
bind = CTRL ALT, T, exec, $terminal
bind = $mod, E, exec, $fileManager
bind = $mod, W, exec, $browser
bind = $mod, C, exec, $editor
bind = CTRL SHIFT, Escape, exec, $taskManager
bind = CTRL $mod, V, exec, pavucontrol

# Overview & search: tap Super (release without another key) — like ii
bindr = $mod, Super_L, global, lumen:overviewTap
bind = $mod, Space, global, lumen:overview
bind = $mod, V, global, lumen:clipboard
bind = $mod, period, global, lumen:emoji

# ── Windows ──────────────────────────────────────────────────────────────────
bind = $mod, Q, killactive
bind = ALT, F4, killactive
bind = $mod SHIFT ALT, Q, exec, hyprctl kill
bind = $mod ALT, Space, togglefloating
bind = $mod ALT, Space, centerwindow
bind = $mod, F, fullscreen, 0            # true fullscreen
bind = $mod, D, fullscreen, 1            # maximise (keeps bar + gaps)
bind = $mod, P, pin
bind = $mod SHIFT, G, exec, $bin/lumen transparency toggle   # window transparency on/off
bind = $mod, J, layoutmsg, togglesplit
bind = $mod ALT, Return, global, lumen:appMenu          # menu of the focused app
bind = $mod, U, pseudo                   # pseudo-tile: keeps its own size inside the tile

# Focus / move (arrows, like ii)
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# Resize (hold to repeat)
binde = $mod ALT, left,  resizeactive, -40 0
binde = $mod ALT, right, resizeactive, 40 0
binde = $mod ALT, up,    resizeactive, 0 -40
binde = $mod ALT, down,  resizeactive, 0 40
binde = $mod, Semicolon,  layoutmsg, splitratio -0.1
binde = $mod, Apostrophe, layoutmsg, splitratio +0.1

# Mouse: drag to move, right-drag to resize
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Window groups (tabs)
bind = $mod, G, togglegroup
bind = $mod ALT, Tab, changegroupactive, f
bind = $mod, Tab, global, lumen:overview

# ── Workspaces ───────────────────────────────────────────────────────────────
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move window and follow
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Move window silently (like ii's SUPER+ALT+n)
bind = $mod ALT, 1, movetoworkspacesilent, 1
bind = $mod ALT, 2, movetoworkspacesilent, 2
bind = $mod ALT, 3, movetoworkspacesilent, 3
bind = $mod ALT, 4, movetoworkspacesilent, 4
bind = $mod ALT, 5, movetoworkspacesilent, 5
bind = $mod ALT, 6, movetoworkspacesilent, 6
bind = $mod ALT, 7, movetoworkspacesilent, 7
bind = $mod ALT, 8, movetoworkspacesilent, 8
bind = $mod ALT, 9, movetoworkspacesilent, 9
bind = $mod ALT, 0, movetoworkspacesilent, 10

# Neighbours
bind = CTRL $mod, right, workspace, r+1
bind = CTRL $mod, left,  workspace, r-1
bind = $mod, Page_Down, workspace, r+1
bind = $mod, Page_Up,   workspace, r-1
bind = $mod SHIFT, Page_Down, movetoworkspace, r+1
bind = $mod SHIFT, Page_Up,   movetoworkspace, r-1
bind = $mod, mouse_down, workspace, r+1
bind = $mod, mouse_up,   workspace, r-1
# Mouse side buttons (Back / Forward) with Super step through workspaces
bind = $mod, mouse:275, workspace, r-1
bind = $mod, mouse:276, workspace, r+1

# Special workspaces (see workspaces.conf)
bind = $mod, S, togglespecialworkspace, scratch
bind = $mod ALT, S, movetoworkspacesilent, special:scratch
bind = $mod, grave, togglespecialworkspace, term
bind = $mod SHIFT, grave, togglespecialworkspace, music

# ── Media & hardware keys (work on the lock screen) ─────────────────────────
# These only change state. The shell listens to PipeWire / backlight events
# and shows the island — no OSD logic lives in keybinds.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl  = $mod ALT, M,            exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# Brightness goes through the shell so the island knows it was you (and
# hypridle's dimming stays silent). Falls back if the shell isn't running.
$qsipc = ~/.config/lumen/bin/lumen-shell-ipc   # this session's shell only
bindel = , XF86MonBrightnessUp,   exec, $qsipc brightness up || brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, $qsipc brightness down || brightnessctl -e4 -n2 set 5%-

bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPrev,  exec, playerctl previous
bindl = $mod SHIFT, P, exec, playerctl play-pause
bindl = $mod SHIFT, N, exec, playerctl next
bindl = $mod SHIFT, B, exec, playerctl previous

# ── Sidebar & notifications (same keys as ii) ───────────────────────────────
bind = $mod, N, global, lumen:sidebar
bind = $mod ALT, N, global, lumen:dnd
bind = $mod ALT SHIFT, N, global, lumen:clearNotifications

# ── Island ───────────────────────────────────────────────────────────────────
bind = $mod, M, global, lumen:island          # expand (media controls); Esc closes

# ── Capture ──────────────────────────────────────────────────────────────────
bind = , Print, exec, $scripts/screenshot.sh screen
bind = $mod SHIFT, S, exec, $scripts/screenshot.sh region
bind = ALT, Print, exec, $scripts/screenshot.sh window
bind = $mod SHIFT, C, exec, hyprpicker -a

# ── Look ─────────────────────────────────────────────────────────────────────
bind = CTRL $mod, T, global, lumen:wallpapers             # wallpaper picker
bind = CTRL $mod ALT, T, global, lumen:wallpaperRandom     # random wallpaper
bindl = $mod SHIFT, R, exec, $scripts/screen-record.sh toggle region
bindl = CTRL ALT, R, exec, $scripts/screen-record.sh toggle screen
bindl = $mod SHIFT ALT, R, exec, $scripts/screen-record.sh toggle screen --audio

# Zoom (accessibility)
binde = $mod, Equal, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.25')
binde = $mod, Minus, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '[.float / 1.25, 1] | max')

# ── Session ──────────────────────────────────────────────────────────────────
bind = $mod, L, exec, $qsipc lock lock || loginctl lock-session
bind = $mod SHIFT, L, exec, systemctl suspend
bind = $mod, Escape, global, lumen:powerMenu
bind = CTRL ALT, Delete, global, lumen:powerMenu
# Emergency exit if the shell itself is broken (the power menu needs it)
bind = CTRL ALT SHIFT $mod, Escape, exit
bind = CTRL $mod, R, exec, hyprctl reload; $qsipc shell reload   # reload Lumen
bind = $mod, Slash, global, lumen:cheatsheet              # this cheatsheet
bind = $mod, I, global, lumen:settings                    # Lumen Settings
