# ── Look: geometry, borders, glass, shadows ─────────────────────────────────
# Every value here comes from a token ($lm_*). DESIGN.md §5–§6.

general {
    layout = dwindle

    gaps_in = $lm_gaps_in
    gaps_out = $lm_gaps_out
    gaps_workspaces = 48

    border_size = $lm_border_size
    col.active_border = $lm_accent_border
    col.inactive_border = $lm_border

    resize_on_border = true
    extend_border_grab_area = 12
    no_focus_fallback = true
    allow_tearing = true          # only affects windows with the `immediate` rule

    snap {
        enabled = true
        window_gap = $lm_gaps_in
        monitor_gap = $lm_gaps_out
        respect_gaps = true
    }
}

decoration {
    rounding = $lm_radius_window
    rounding_power = $lm_squircle

    # Windows are opaque (DESIGN.md §6.1). Glass is for the shell only.
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0
    dim_special = 0.35
    dim_around = 0.4

    blur {
        enabled = true
        size = $lm_blur_size
        passes = $lm_blur_passes
        noise = $lm_blur_noise
        contrast = $lm_blur_contrast
        brightness = $lm_blur_brightness
        vibrancy = $lm_blur_vibrancy
        vibrancy_darkness = 0.0
        new_optimizations = true
        xray = false              # glass shows what's really behind it
        special = true            # scratchpads float over a frosted desktop
        popups = true             # context menus are frosted too
        popups_ignorealpha = 0.2
    }

    # Soft shadow, floating windows only (tiled get none — see rules.conf)
    shadow {
        enabled = true
        range = $lm_shadow_range
        render_power = $lm_shadow_power
        color = $lm_shadow
        color_inactive = rgba(00000033)
        offset = 0 4
    }
}

dwindle {
    preserve_split = true
    smart_split = false
    force_split = 2               # new window goes right / below
}

master {
    new_status = slave
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = $lm_bg
    force_default_wallpaper = 0

    vrr = 2                       # adaptive sync in fullscreen only
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    focus_on_activate = true
    on_focus_under_fullscreen = 2
    allow_session_lock_restore = true
    initial_workspace_tracking = 0
}

cursor {
    inactive_timeout = 5          # hide the pointer while typing / idle
    hide_on_key_press = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}
