# ─────────────────────────────────────────────────────────────────────────────
#  Lumen — Hyprland entry point
#  This file only wires modules together. Settings live in the sourced files.
#  Launched by bin/lumen-session (never edit ~/.config/hypr for Lumen).
# ─────────────────────────────────────────────────────────────────────────────

# Design tokens (generated by theme/build.py — run `lumen theme` to rebuild)
source = ~/.config/lumen/generated/hypr/vars.conf
source = ~/.config/lumen/generated/hypr/curves.conf

source = ~/.config/lumen/hypr/environment.conf
source = ~/.config/lumen/hypr/monitors.conf
source = ~/.config/lumen/hypr/input.conf
source = ~/.config/lumen/hypr/look.conf
source = ~/.config/lumen/hypr/animations.conf
source = ~/.config/lumen/hypr/workspaces.conf
source = ~/.config/lumen/hypr/rules.conf
source = ~/.config/lumen/hypr/keybinds.conf
source = ~/.config/lumen/hypr/startup.conf

# Machine-local overrides (not tracked). Create it if you need one.
source = ~/.config/lumen/local.conf
