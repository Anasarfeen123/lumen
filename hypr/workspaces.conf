# ── Workspaces ───────────────────────────────────────────────────────────────
# 1–10 are normal workspaces (created on demand). Special workspaces are
# overlays that slide down over whatever you're doing:
#
#   special:scratch  SUPER+S        general scratchpad (send with SUPER+ALT+S)
#   special:term     SUPER+grave    drop-down terminal (spawned on first use)
#   special:music    SUPER+SHIFT+grave  music/media apps

workspace = special:scratch, gapsout:48
workspace = special:term, gapsout:48 160 360 160, on-created-empty:kitty --class lumen-dropterm
workspace = special:music, gapsout:48 120
