# ── Animations ───────────────────────────────────────────────────────────────
# Durations ($lm_t_*) and curves (lm_*) come from theme/tokens.toml [motion].
# DESIGN.md §7: nothing over 320 ms, exits faster than entries, motion must
# explain something. Hyprland speed unit = 100 ms.
#
#   micro     120 ms  standard      border colour, focus
#   normal    220 ms  standard      fades, layers
#   window    280 ms  emphasized    open / move / resize
#   large     320 ms  emphasized    workspace switch
#   exits     ×0.7    accelerate

animations {
    enabled = true

    animation = global, 1, $lm_t_normal, lm_standard

    # Windows: grow in from 86 % on a soft spring (a hint of overshoot, then
    # settle) while fading — they arrive rather than appear. Closing is faster
    # and shrinks away. Moves feel physical.
    animation = windowsIn, 1, $lm_t_large, lm_spring, popin 86%
    animation = windowsOut, 1, $lm_t_window_exit, lm_accelerate, popin 92%
    animation = windowsMove, 1, $lm_t_window, lm_emphasized, slide

    # Fades
    animation = fadeIn, 1, $lm_t_window, lm_standard
    animation = fadeOut, 1, $lm_t_normal_exit, lm_accelerate
    animation = fadeSwitch, 1, $lm_t_micro, lm_standard
    animation = fadeShadow, 1, $lm_t_micro, lm_standard
    animation = fadeDim, 1, $lm_t_normal, lm_standard

    # Border: colour cross-fade on focus; no spinning gradients
    animation = border, 1, $lm_t_micro, lm_standard
    animation = borderangle, 0

    # Layers (shell surfaces animate themselves in QML; lumen-* layers opt out
    # in rules.conf). These cover third-party layers like fuzzel/hyprpicker.
    animation = layersIn, 1, $lm_t_normal, lm_standard, popin 96%
    animation = layersOut, 1, $lm_t_normal_exit, lm_accelerate, fade
    animation = fadeLayersIn, 1, $lm_t_normal, lm_standard
    animation = fadeLayersOut, 1, $lm_t_normal_exit, lm_accelerate

    # Workspaces slide in the direction you moved — only 12 % of the way, with a
    # fade — so the switch reads as direction without a full-screen sweep;
    # scratchpads drop vertically
    animation = workspaces, 1, $lm_t_large, lm_emphasized, slidefade 12%
    animation = specialWorkspace, 1, $lm_t_window, lm_emphasized, slidevert

    animation = zoomFactor, 1, $lm_t_normal, lm_standard
}
