# ── Environment ──────────────────────────────────────────────────────────────
# GPU selection (AQ_DRM_DEVICES) is NOT set here: bin/lumen-session detects the
# AMD iGPU / NVIDIA dGPU at login and exports it before Hyprland starts, because
# /dev/dri/cardN numbering changes between boots.
#
# Deliberately absent: GBM_BACKEND=nvidia-drm, __GLX_VENDOR_LIBRARY_NAME=nvidia,
# LIBVA_DRIVER_NAME=nvidia. Those force the dGPU on for everything and kill
# battery life. Run a single app on NVIDIA with:  lumen-dgpu <app>

env = LUMEN, 1

# Session identity (portals, screen sharing, file pickers)
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland

# Toolkits: prefer Wayland, fall back to X11
env = GDK_BACKEND, wayland,x11,*
env = QT_QPA_PLATFORM, wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = QT_AUTO_SCREEN_SCALE_FACTOR, 1
env = ELECTRON_OZONE_PLATFORM_HINT, auto

# Qt uses KDE's platform theme so Qt apps and dialogs match Plasma's settings
# (Phase 9 points Plasma's colors at the Lumen tokens).
env = QT_QPA_PLATFORMTHEME, kde
env = XDG_MENU_PREFIX, plasma-

# Cursor (replaced in Phase 9)
env = XCURSOR_SIZE, 24
env = HYPRCURSOR_SIZE, 24
