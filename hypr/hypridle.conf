# ── Idle ─────────────────────────────────────────────────────────────────────
# dim (4 min) → lock (5 min) → screen off (5.5 min) → suspend (15 min)
# Fullscreen video/games inhibit idle via the idle_inhibit rule in rules.conf.

general {
    # The Lumen shell draws the lock; hyprlock is the fallback if the shell isn't running
    lock_cmd = ~/.config/lumen/bin/lumen-shell-ipc lock lock || pidof hyprlock || hyprlock -c ~/.config/lumen/hypr/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    # Screen on, then let Face ID look straight away (you just opened the lid)
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'; ~/.config/lumen/bin/lumen-shell-ipc lock wake
    ignore_dbus_inhibit = false
    # Hold off suspend until the lock screen is actually up (ext-session-lock
    # confirmed). Without this, sleep can race the lock: on wake you may see
    # the desktop for a frame, or apps wake into a half-drawn screen.
    inhibit_sleep = 3
}

listener {
    timeout = 240
    on-timeout = brightnessctl -s set 20%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")' && brightnessctl -r
}

listener {
    timeout = 900
    on-timeout = systemctl suspend
}
