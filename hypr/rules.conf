# ── Window & layer rules ─────────────────────────────────────────────────────
# Syntax (Hyprland ≥ 0.53):  windowrule = <effect> <value>, match:<prop> <value>

# ── Global behaviour ─────────────────────────────────────────────────────────
# Tiled windows don't float, so they don't cast shadows (DESIGN.md §6.3).
windowrule = no_shadow on, match:float false

# A lone tiled window needs no focus border: there is nothing to tell apart.
# (Gaps and rounding stay — the desktop keeps its shape.)
windowrule = border_size 0, match:float false, match:workspace w[tv1]

# XWayland drag/menus without a title or class: never blur or shadow them.
windowrule = no_blur on, match:class ^()$, match:title ^()$
windowrule = no_shadow on, match:class ^()$, match:title ^()$

# ── Dialogs & utilities float, centred ───────────────────────────────────────
windowrule = float on, match:title ^(Open File|Open Folder|Select a File|Save As|Save File|File Upload|Choose Files?)(.*)$
windowrule = center on, match:title ^(Open File|Open Folder|Select a File|Save As|Save File|File Upload|Choose Files?)(.*)$
windowrule = size (monitor_w*0.6) (monitor_h*0.65), match:title ^(Open File|Open Folder|Select a File|Save As|Save File|File Upload|Choose Files?)(.*)$
windowrule = float on, match:title ^(.*)(wants to (save|open))$
windowrule = float on, match:class ^(org\.freedesktop\.impl\.portal\.desktop\.(kde|gtk|gnome))$
windowrule = center on, match:class ^(org\.freedesktop\.impl\.portal\.desktop\.(kde|gtk|gnome))$
windowrule = size (monitor_w*0.6) (monitor_h*0.65), match:class ^(org\.freedesktop\.impl\.portal\.desktop\.(kde|gtk|gnome))$

windowrule = float on, match:class ^(org\.pulseaudio\.pavucontrol|pavucontrol|pavucontrol-qt)$
windowrule = size (monitor_w*0.45) (monitor_h*0.5), match:class ^(org\.pulseaudio\.pavucontrol|pavucontrol|pavucontrol-qt)$
windowrule = center on, match:class ^(org\.pulseaudio\.pavucontrol|pavucontrol|pavucontrol-qt)$
windowrule = float on, match:class ^(nm-connection-editor|blueman-manager|\.?blueberry.*|org\.kde\.bluedevilwizard)$
windowrule = float on, match:class ^(kcm_.*|.*plasmawindowed.*|org\.kde\.polkit-kde-authentication-agent-1)$
windowrule = center on, match:class ^(org\.kde\.polkit-kde-authentication-agent-1)$
windowrule = float on, match:class ^(org\.kde\.ark|org\.kde\.kcalc|qalculate-gtk)$
windowrule = float on, match:title ^(Copying|Moving|Deleting)(.*)(Dolphin)$

# ── Lumen's own windows ──────────────────────────────────────────────────────
# Settings draws its own translucent background, so the compositor leaves it
# at full opacity (and blurs behind it); Face ID setup is a small terminal.
windowrule = float on, match:title ^(Lumen Settings)$
windowrule = size 1020 760, match:title ^(Lumen Settings)$
windowrule = center on, match:title ^(Lumen Settings)$
windowrule = opacity 1.0 1.0, match:title ^(Lumen Settings)$
windowrule = float on, match:class ^(lumen-faceid)$
windowrule = size 760 520, match:class ^(lumen-faceid)$
windowrule = center on, match:class ^(lumen-faceid)$

# ── Picture-in-Picture: small, pinned, bottom-right ─────────────────────────
windowrule = float on, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = pin on, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = keep_aspect_ratio on, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = size (monitor_w*0.25) (monitor_h*0.25), match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = move (monitor_w*0.73) (monitor_h*0.72), match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$

# Screen-share indicator popups: out of the way, bottom-centre
windowrule = float on, match:title .*is sharing (a window|your screen).*
windowrule = pin on, match:title .*is sharing (a window|your screen).*
windowrule = move (monitor_w*0.5-window_w*0.5) (monitor_h-window_h-12), match:title .*is sharing (a window|your screen).*

# ── Window transparency (DESIGN.md §6.1) — toggle: Super+Shift+G ────────────
# Order matters: later rules win. Every app → a light frost; glass apps →
# more; video, games and fullscreen → opaque.
windowrule = opacity $lm_app_active $lm_app_inactive, match:class .*
# kitty draws its own translucent background (generated/kitty/theme.conf) so
# text stays crisp — the compositor must not fade it a second time
windowrule = opacity 1.0 1.0, match:class ^(kitty|lumen-dropterm)$
windowrule = opacity $lm_terminal_opacity $lm_terminal_opacity, match:class ^(foot)$
windowrule = opacity $lm_glass_app_active $lm_glass_app_inactive, match:class ^(org\.kde\.dolphin|org\.gnome\.Nautilus|systemsettings|org\.kde\.systemsettings|org\.pulseaudio\.pavucontrol|pavucontrol|pavucontrol-qt|nm-connection-editor|org\.kde\.plasma-systemmonitor|org\.gnome\.SystemMonitor|org\.kde\.kcalc|qalculate-gtk|org\.kde\.ark|blueman-manager|nwg-look|org\.kde\.bluedevilwizard|kcm_.*)$
# Video and games stay fully opaque, as does anything fullscreen
windowrule = opacity 1.0 1.0, match:class ^(mpv|vlc|io\.github\.celluloid_player\.Celluloid|org\.kde\.haruna|steam_app_.*|gamescope|.*\.exe)$
windowrule = opacity 1.0 1.0, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = opaque on, match:fullscreen true

# ── Application workspaces (only apps that benefit from a fixed home) ────────
windowrule = workspace special:music silent, match:class ^(Spotify|spotify|com\.spotify\.Client)$
windowrule = workspace 9 silent, match:class ^(steam)$

# ── Games: tearing allowed, no idle while fullscreen ────────────────────────
windowrule = immediate on, match:class ^(steam_app_.*|gamescope)$
windowrule = idle_inhibit fullscreen, match:class .*

# ── Layers ───────────────────────────────────────────────────────────────────
# Lumen shell surfaces (namespace "lumen-*") animate themselves in QML, so
# Hyprland must not animate them again. They get the shared glass blur;
# ignore_alpha keeps fully transparent pixels (shadows, gaps) unblurred.
layerrule = no_anim on, match:namespace ^(lumen-.*)$
layerrule = blur on, match:namespace ^(lumen-.*)$
layerrule = ignore_alpha 0.3, match:namespace ^(lumen-.*)$
# …except the wallpaper: nothing sits behind it, so blurring it is pure cost
layerrule = blur off, match:namespace ^(lumen-wallpaper)$

# Pickers/selectors must appear instantly
layerrule = no_anim on, match:namespace ^(hyprpicker|selection)$
