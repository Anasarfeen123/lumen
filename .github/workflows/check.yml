# Lumen's checks on every push and pull request (DESIGN.md §12):
#   shell     shellcheck (errors) on bin/ and scripts/
#   python    every script byte-compiles
#   lua       the Hyprland config parses (luac -p)
#   qml       every QML file parses (qmlformat). A full qmllint needs
#             Quickshell's types, which a stock runner doesn't have, so this
#             catches syntax errors only — the kind that stop the shell loading.
name: check
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck lua5.4 qt6-declarative-dev-tools

      - name: Shell scripts
        run: |
          files=$(grep -lE '^#!.*\b(sh|bash)\b' bin/* scripts/*.sh 2>/dev/null)
          shellcheck -S error $files

      - name: Python scripts
        run: python3 -m py_compile scripts/*.py

      - name: Hyprland config (Lua)
        run: for f in hypr/*.lua; do luac5.4 -p "$f" || exit 1; done

      - name: QML parses
        run: |
          fmt=$(command -v qmlformat || ls /usr/lib/qt6/bin/qmlformat /usr/lib/x86_64-linux-gnu/qt6/bin/qmlformat 2>/dev/null | head -1)
          [ -n "$fmt" ] || { echo "qmlformat not found"; exit 1; }
          bad=0
          while IFS= read -r f; do
            "$fmt" "$f" > /dev/null 2> err.txt || { echo "::error file=$f::$(head -1 err.txt)"; bad=1; }
          done < <(find shell -name '*.qml')
          exit $bad
