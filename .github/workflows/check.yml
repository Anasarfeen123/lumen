# Lumen's checks on every push and pull request (DESIGN.md §12):
#   shell     shellcheck (errors) on bin/ and scripts/
#   python    every script byte-compiles
#   lua       the Hyprland config parses (luac -p)
#   qml       every QML file parses (qmllint on Fedora's Qt, warnings uncapped:
#             Quickshell's types aren't there) — the errors that stop the shell loading.
name: check
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck lua5.4

      - name: Shell scripts
        run: |
          files=$(grep -lE '^#!.*\b(sh|bash)\b' bin/* scripts/*.sh 2>/dev/null)
          shellcheck -S error $files

      - name: Python scripts
        run: python3 -m py_compile scripts/*.py

      - name: File operation safety tests
        run: python3 -m unittest discover -s tests -v

      - name: Hyprland config (Lua)
        run: for f in hypr/*.lua; do luac5.4 -p "$f" || exit 1; done

  qml:
    # Fedora, for a Qt as new as the one Lumen runs on (Ubuntu's 6.4 can't
    # parse some of the JavaScript Lumen uses, and its qmlformat reports its
    # own formatter checks as errors)
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: dnf install -y -q qt6-qtdeclarative-devel findutils
      - name: QML parses
        run: |
          lint=$(command -v qmllint || ls /usr/lib64/qt6/bin/qmllint 2>/dev/null | head -1)
          [ -n "$lint" ] || { echo "qmllint not found"; exit 1; }
          bad=0
          # warnings uncapped (Quickshell's types aren't here); a syntax error still fails
          for f in $(find shell -name '*.qml'); do
            "$lint" --max-warnings -1 "$f" > out.txt 2>&1 || { grep -m3 -iE "error|expected" out.txt | sed "s|^|::error file=$f::|"; bad=1; }
          done
          exit $bad
