# Lumen kitty — used ONLY inside Lumen sessions (bin/lumen-session exports
# KITTY_CONFIG_DIRECTORY). Your shared ~/.config/kitty/kitty.conf still
# applies; Lumen layers its colours and a few touches on top. ii is unaffected.

include ~/.config/kitty/kitty.conf

# Colours, cursor, selection, tabs and background opacity from the tokens
# (regenerated by `lumen theme`; running kitties reload on SIGUSR1)
include ~/.config/lumen/generated/kitty/theme.conf

# Kitty draws its own translucent background so text stays fully crisp;
# Hyprland therefore leaves kitty windows at opacity 1 (rules.conf).
background_blur 0

# Room to breathe — same rhythm as the desktop's 4 px grid
window_padding_width 12 14
window_margin_width 0
single_window_margin_width 0

# The cursor glides rather than jumps
cursor_shape beam
cursor_beam_thickness 1.6
cursor_trail 3
cursor_trail_decay 0.08 0.3
cursor_trail_start_threshold 3
cursor_blink_interval 0.7 ease-in-out
cursor_stop_blinking_after 12

# Calm tabs: a quiet strip, the active tab lifted
tab_bar_edge bottom
tab_bar_style separator
tab_separator "  "
tab_title_template " {index}  {title} "
tab_bar_margin_height 4 4
active_tab_font_style bold
inactive_tab_font_style normal

# Smooth-feeling scrolling and a subtle visual bell instead of a sound
touch_scroll_multiplier 2.0
visual_bell_duration 0.12
visual_bell_color #52d1e9
