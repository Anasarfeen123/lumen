# Dark — the reference theme. Neutrals are [L, C] at the shared neutral hue.
name = "Dark"
mode = "dark"
neutral_hue = 255

[neutral]
bg               = [0.170, 0.010]
surface          = [0.215, 0.011]
surface_elevated = [0.255, 0.012]
surface_hover    = [0.300, 0.012]
text             = [0.960, 0.004]
text_secondary   = [0.780, 0.010]
text_muted       = [0.625, 0.012]

[edge]            # hairlines are a translucent overlay, not a color
base   = "ffffff"
border = 0.08
strong = 0.14

[accent]
l = 0.80
c = 0.115
hover_dl  = 0.05
on_accent = [0.20, 0.02]   # dark text on accent (never white)

[status]          # [L, C, H]
success = [0.80, 0.14, 152]
warning = [0.85, 0.13, 88]
error   = [0.70, 0.17, 25]

[glass]
alpha_scale = 1.0
