<!doctype html>
<!-- Lumen · Find my laptop — the phone remote. scripts/findmy.py fills in the
     channel and key (`findmy.py remote`); keep this file private: anyone with it
     can ring, lock and locate the laptop. Messages are sealed with AES-256-GCM
     here in the browser; the relay (ntfy) only carries ciphertext. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1014">
<title>Find my laptop</title>
<style>
  :root { --bg: #0d1014; --card: #161a1f; --line: #262b31; --text: #f0f2f4; --dim: #9aa1a8; --accent: #52d1e9; --warn: #f1c961; --bad: #f66d67; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; }
  h1 { font-size: 22px; margin: 6px 0 2px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 16px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 4px; background: var(--dim); margin-right: 6px; vertical-align: 1px; }
  .dot.on { background: #6fd38b; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 12px; text-align: left; cursor: pointer; }
  button b { display: block; font-size: 16px; }
  button span { color: var(--dim); font-size: 12px; }
  button:active { transform: scale(0.98); }
  button.primary { border-color: var(--accent); }
  button.danger { border-color: var(--bad); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 12px; }
  label { display: block; color: var(--dim); font-size: 12px; margin: 8px 0 4px; }
  input { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .log { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .msg .t { color: var(--dim); font-size: 12px; }
  .msg.err { border-color: var(--bad); }
  .msg a { color: var(--accent); }
  .msg img { width: 100%; border-radius: 10px; margin-top: 8px; }
  .kv { color: var(--dim); font-size: 13px; }
  .kv b { color: var(--text); font-weight: 600; }
  h2 { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; margin: 20px 0 6px; }
</style>
</head>
<body>
<main>
  <h1>Find my laptop</h1>
  <div class="sub"><span id="dot" class="dot"></span><span id="conn">Connecting…</span> · <span id="host"></span></div>

  <div class="grid">
    <button class="primary" data-cmd="ring"><b>Ring</b><span>Loud alarm, even on mute</span></button>
    <button data-cmd="stop"><b>Stop</b><span>Stop ringing</span></button>
    <button class="primary" data-cmd="locate"><b>Locate</b><span>Wi-Fi location, battery</span></button>
    <button data-cmd="status"><b>Status</b><span>Battery, network</span></button>
    <button data-cmd="photo"><b>Photo</b><span>Webcam picture</span></button>
    <button data-cmd="screen"><b>Screenshot</b><span>What's on screen</span></button>
  </div>

  <h2>Lost mode</h2>
  <div class="card">
    <label for="lm">Message on its lock screen</label>
    <input id="lm" placeholder="This laptop is lost. Please call me." maxlength="300">
    <label for="lp">Your phone number</label>
    <input id="lp" placeholder="+91 …" maxlength="40" inputmode="tel">
    <div class="grid" style="margin-top:12px">
      <button class="danger" data-cmd="lock"><b>Lock it</b><span>Lock + lost mode + reports</span></button>
      <button data-cmd="lostoff"><b>Found it</b><span>Lost mode off</span></button>
    </div>
  </div>

  <h2>Replies</h2>
  <div id="log" class="log"></div>
</main>
<script>
const SERVER = __SERVER__, TOPIC = __TOPIC__, KEY = __KEY__, HOST = __HOST__;
const AAD = new TextEncoder().encode("lumen-findmy-v1");
const $ = id => document.getElementById(id);
$("host").textContent = HOST;
const store = { get: k => { try { return localStorage.getItem("lumen-findmy-" + k) || ""; } catch (e) { return ""; } },
                set: (k, v) => { try { localStorage.setItem("lumen-findmy-" + k, v); } catch (e) {} } };
$("lm").value = store.get("message"); $("lp").value = store.get("phone");
$("lm").oninput = () => store.set("message", $("lm").value); $("lp").oninput = () => store.set("phone", $("lp").value);

const b64u = { dec: s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)), c => c.charCodeAt(0)),
               enc: b => btoa(String.fromCharCode(...b)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "") };
let key;
async function getKey() { return key ??= await crypto.subtle.importKey("raw", b64u.dec(KEY), "AES-GCM", false, ["encrypt", "decrypt"]); }
async function seal(obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv, additionalData: AAD }, await getKey(), new TextEncoder().encode(JSON.stringify(obj))));
  const all = new Uint8Array(12 + ct.length); all.set(iv); all.set(ct, 12);
  return "lm1." + b64u.enc(all);
}
async function openBytes(raw) {
  return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(0, 12), additionalData: AAD }, await getKey(), raw.slice(12)));
}
async function unseal(text) {
  if (typeof text !== "string" || !text.startsWith("lm1.")) return null;
  try { return JSON.parse(new TextDecoder().decode(await openBytes(b64u.dec(text.slice(4))))); } catch (e) { return null; }
}

const NAMES = { ring: "Ring", stop: "Stop", locate: "Locate", status: "Status", photo: "Photo", screen: "Screenshot", lock: "Lock it", lost: "Lost mode", report: "Lost mode report" };
function when(t) { return new Date(t * 1000).toLocaleString([], { hour: "2-digit", minute: "2-digit", day: "numeric", month: "short" }); }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
function add(html, cls, top) { const d = document.createElement("div"); d.className = "msg " + (cls || ""); d.innerHTML = html; top ? $("log").prepend(d) : $("log").append(d); return d; }

async function send(cmd, args) {
  const id = crypto.getRandomValues(new Uint32Array(2)).join("-");
  const body = await seal({ frm: "phone", cmd, args: args || {}, id, t: Math.floor(Date.now() / 1000) });
  const sent = add(`<div class="t">You · ${when(Date.now() / 1000)}</div><b>${NAMES[cmd] || cmd}</b> — sent, waiting for the laptop…`, "", true);
  sent.dataset.id = id;
  try { const r = await fetch(SERVER + "/" + TOPIC, { method: "POST", body }); if (!r.ok) throw new Error(r.status); }
  catch (e) { sent.classList.add("err"); sent.innerHTML += "<br>Couldn't reach the relay (" + esc(e.message) + ")."; }
}
document.querySelectorAll("button[data-cmd]").forEach(b => b.onclick = () => {
  const c = b.dataset.cmd;
  if (c === "lock") return send("lock", { message: $("lm").value, phone: $("lp").value });
  if (c === "lostoff") return send("lost", { on: "off" });
  if (c === "ring") return send("ring", { message: $("lm").value });
  send(c);
});

const seenMsg = new Set();
async function show(m) {
  if (seenMsg.has(m.id)) return; seenMsg.add(m.id);
  const r = await unseal(m.message);
  if (!r || r.frm !== "laptop") return;
  const pending = r.re && document.querySelector(`.msg[data-id="${r.re}"]`);
  if (pending) pending.innerHTML = pending.innerHTML.replace(" — sent, waiting for the laptop…", " — received");
  let html = `<div class="t">${esc(HOST)} · ${when(r.t)}</div><b>${esc(NAMES[r.cmd] || r.cmd)}</b>`;
  if (r.note) html += " — " + esc(r.note);
  if (r.location) {
    const { lat, lng, accuracy } = r.location;
    html += `<div class="kv" style="margin-top:6px">Around <b>${lat.toFixed(5)}, ${lng.toFixed(5)}</b> (± ${accuracy} m)<br>
             <a href="https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=17/${lat}/${lng}" target="_blank" rel="noopener">Open the map</a> ·
             <a href="geo:${lat},${lng}?q=${lat},${lng}">Open in maps app</a></div>`;
  } else if (r.cmd === "locate" || r.cmd === "report") html += `<div class="kv">No location${r.error ? ": " + esc(r.error) : ""}</div>`;
  if (r.battery || r.network) {
    const bits = [];
    if (r.battery) bits.push(`Battery <b>${r.battery.percent}%</b> ${esc(r.battery.state.toLowerCase())}`);
    if (r.network) bits.push(r.network.wifi ? `Wi-Fi <b>${esc(r.network.wifi)}</b>` : (r.network.connections || []).length ? `On <b>${esc(r.network.connections[0])}</b>` : "No network name");
    if (r.uptimeMin !== undefined) bits.push(`up ${Math.floor(r.uptimeMin / 60)} h ${r.uptimeMin % 60} min`);
    if (r.lost !== undefined) bits.push(r.lost ? "<b>lost mode on</b>" : "lost mode off");
    html += `<div class="kv" style="margin-top:4px">${bits.join(" · ")}</div>`;
  }
  const el = add(html, r.ok === false ? "err" : "", true);
  if (m.attachment?.url) {
    try {
      const raw = new Uint8Array(await (await fetch(m.attachment.url)).arrayBuffer());
      const img = document.createElement("img");
      img.src = URL.createObjectURL(new Blob([await openBytes(raw)], { type: "image/jpeg" }));
      el.append(img);
    } catch (e) { el.innerHTML += `<div class="kv">The picture has expired on the relay (it keeps files about 3 hours).</div>`; }
  }
}

// listen: the last 12 hours, then live
function listen() {
  const es = new EventSource(SERVER + "/" + TOPIC + "/sse?since=12h");
  es.onopen = () => { $("dot").className = "dot on"; $("conn").textContent = "Connected to the relay"; };
  es.onmessage = e => { try { const m = JSON.parse(e.data); if (m.event === "message") show(m); } catch (err) {} };
  es.onerror = () => { $("dot").className = "dot"; $("conn").textContent = "Reconnecting…"; };
}
listen();
</script>
</body>
</html>
